<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Gestor de Finanzas</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#007AFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin:0; padding:0; background:#e5e7eb; overscroll-behavior:none; }
  .h-safe-top { height: env(safe-area-inset-top, 0px); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div id="root">
  <div style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#888;">Cargando...</div>
</div>
<div id="error-box" style="display:none;padding:16px;margin:16px;background:#fff0f0;border:1px solid #ffb3b3;border-radius:12px;color:#a30000;font-family:monospace;font-size:12px;white-space:pre-wrap;"></div>

<script>
  window.addEventListener('error', function (e) {
    var box = document.getElementById('error-box');
    if (box) {
      box.style.display = 'block';
      box.textContent = 'Error: ' + e.message + '\n' + (e.filename ? (e.filename + ':' + e.lineno) : '');
    }
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const HomeIcon = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const PlusIcon = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
const ListIcon = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
const TrendingUpIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34C759" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
const TrendingDownIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
const CreditCardIcon = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
const SettingsIcon = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
const BellIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9500" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
const ArrowUpIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>;
const ArrowDownIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
const ArrowLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
const BuildingIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>;

function ExpenseTrackerApp() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [subTab, setSubTab] = useState('historial');
  const [transactions, setTransactions] = useState([]);
  const [paymentMethods, setPaymentMethods] = useState([]);
  const [settings, setSettings] = useState({ currency: 'ARS' });
  const [selectedMonth, setSelectedMonth] = useState(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  });
  const [categories, setCategories] = useState([]);
  const [typesList, setTypesList] = useState([]);
  const [commitments, setCommitments] = useState([]);
  const [installmentTracks, setInstallmentTracks] = useState([]);
  const [bankAccounts, setBankAccounts] = useState([]);
  const [isLoaded, setIsLoaded] = useState(false);
  const [selectedCardId, setSelectedCardId] = useState(null);

  useEffect(() => {
    const savedData = localStorage.getItem('finance_data');
    const savedMethods = localStorage.getItem('finance_methods');
    const savedSettings = localStorage.getItem('finance_settings');
    const savedCategories = localStorage.getItem('finance_categories');
    const savedTypes = localStorage.getItem('finance_types');
    const savedCommitments = localStorage.getItem('finance_commitments');
    const savedInstallmentTracks = localStorage.getItem('finance_installments_track');
    const savedBanks = localStorage.getItem('finance_banks');

    if (savedSettings) try { setSettings(JSON.parse(savedSettings)); } catch (e) {}
    if (savedTypes) { try { setTypesList(JSON.parse(savedTypes)); } catch (e) {} } else {
      setTypesList([{ id: 'diario', name: 'Diario' }, { id: 'mensual', name: 'Mensual' }, { id: 'otro', name: 'Otro' }]);
    }
    if (savedCategories) { try { setCategories(JSON.parse(savedCategories)); } catch (e) {} } else {
      setCategories([
        { id: 'comida', name: 'Comida', type: 'gasto', budget: 50000 },
        { id: 'transporte', name: 'Transporte', type: 'gasto', budget: 30000 },
        { id: 'servicios', name: 'Servicios', type: 'gasto', budget: 40000 },
        { id: 'sueldo', name: 'Sueldo', type: 'ingreso', budget: 0 }
      ]);
    }
    if (savedCommitments) try { setCommitments(JSON.parse(savedCommitments)); } catch (e) {}
    if (savedInstallmentTracks) try { setInstallmentTracks(JSON.parse(savedInstallmentTracks)); } catch (e) {}
    if (savedBanks) try { setBankAccounts(JSON.parse(savedBanks)); } catch (e) {}
    if (savedMethods) { try { setPaymentMethods(JSON.parse(savedMethods)); } catch (e) {} } else {
      setPaymentMethods([
        { id: 1, name: 'Efectivo', type: 'cash', color: 'from-green-400 to-emerald-600' },
        { id: 2, name: 'Tarjeta Débito', type: 'debit', color: 'from-blue-400 to-blue-600' }
      ]);
    }
    if (savedData) {
      try { setTransactions(JSON.parse(savedData)); } catch (e) { console.error('Error loading data', e); }
    } else {
      setTransactions([
        { id: 1, type: 'ingreso', amount: 500000, description: 'Sueldo', date: new Date().toISOString(), category: 'sueldo', typeClassification: 'mensual', methodId: 1 },
        { id: 2, type: 'gasto', amount: 15000, description: 'Supermercado', date: new Date(Date.now() - 86400000).toISOString(), category: 'comida', typeClassification: 'diario', methodId: 2 },
        { id: 3, type: 'gasto', amount: 80000, description: 'Alquiler', date: new Date(Date.now() - 86400000 * 2).toISOString(), category: 'servicios', typeClassification: 'mensual', methodId: 1 }
      ]);
    }
    setIsLoaded(true);
  }, []);

  useEffect(() => {
    if (!isLoaded || !installmentTracks.length) return;
    let hasChanges = false;
    const now = new Date();
    const updatedTracks = installmentTracks.map(q => {
      if (!q.startDate || q.current >= q.total) return q;
      const start = new Date(q.startDate);
      let monthsPassed = (now.getFullYear() - start.getFullYear()) * 12;
      monthsPassed -= start.getMonth();
      monthsPassed += now.getMonth();
      if (now.getDate() < start.getDate()) monthsPassed--;
      if (monthsPassed > 0) {
        hasChanges = true;
        const nextCurrent = Math.min(q.total, q.current + monthsPassed);
        const nextDate = new Date(start);
        nextDate.setMonth(nextDate.getMonth() + monthsPassed);
        return { ...q, current: nextCurrent, startDate: nextDate.toISOString(), originalStartDate: q.originalStartDate || q.startDate };
      }
      return q;
    });
    if (hasChanges) setInstallmentTracks(updatedTracks);
  }, [isLoaded, installmentTracks]);

  useEffect(() => {
    if (isLoaded) {
      localStorage.setItem('finance_data', JSON.stringify(transactions));
      localStorage.setItem('finance_methods', JSON.stringify(paymentMethods));
      localStorage.setItem('finance_settings', JSON.stringify(settings));
      localStorage.setItem('finance_categories', JSON.stringify(categories));
      localStorage.setItem('finance_types', JSON.stringify(typesList));
      localStorage.setItem('finance_commitments', JSON.stringify(commitments));
      localStorage.setItem('finance_installments_track', JSON.stringify(installmentTracks));
      localStorage.setItem('finance_banks', JSON.stringify(bankAccounts));
    }
  }, [transactions, paymentMethods, settings, categories, typesList, commitments, installmentTracks, bankAccounts, isLoaded]);

  const formatAmountInput = (val) => {
    if (!val) return '';
    let clean = val.replace(/[^0-9,]/g, '');
    const parts = clean.split(',');
    if (parts.length > 2) return val;
    let integerPart = parts[0];
    let decimalPart = parts[1] !== undefined ? ',' + parts[1].substring(0, 2) : '';
    if (integerPart) integerPart = parseInt(integerPart, 10).toLocaleString('es-AR');
    return integerPart + decimalPart;
  };

  const parseFormattedAmount = (str) => {
    if (!str) return 0;
    return parseFloat(String(str).replace(/\./g, '').replace(',', '.')) || 0;
  };

  const isTransactionInSelectedMonth = (dateString) => {
    const d = new Date(dateString);
    if (Number.isNaN(d.getTime())) return false;
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${yyyy}-${mm}` === selectedMonth;
  };

  const formatCurrency = (amount) => {
    const numericAmount = parseFloat(amount) || 0;
    const formatted = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(numericAmount);
    const symbols = { ARS: '$', USD: 'US$', EUR: '€' };
    return `${symbols[settings.currency] || '$'} ${formatted}`;
  };

  const globalBalance = useMemo(() => {
    const base = bankAccounts.reduce((sum, b) => sum + (parseFloat(b.initialBalance !== undefined ? b.initialBalance : b.balance) || 0), 0);
    const income = transactions.filter(t => t.type === 'ingreso').reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
    const expense = transactions.filter(t => t.type === 'gasto').reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
    return base + income - expense;
  }, [transactions, bankAccounts]);

  const getBankBalance = (bankId) => {
    const bank = bankAccounts.find(b => b.id === bankId);
    if (!bank) return 0;
    let bal = parseFloat(bank.initialBalance !== undefined ? bank.initialBalance : bank.balance) || 0;
    transactions.forEach(t => {
      if (t.type === 'ingreso' && t.bankId === bankId) bal += parseFloat(t.amount) || 0;
      else if (t.type === 'gasto') {
        const method = paymentMethods.find(m => m.id === t.methodId);
        if (method && method.bankId === bankId) bal -= parseFloat(t.amount) || 0;
      }
    });
    return bal;
  };

  const totals = useMemo(() => transactions.filter(t => isTransactionInSelectedMonth(t.date)).reduce((acc, curr) => {
    const amount = parseFloat(curr.amount) || 0;
    if (curr.type === 'ingreso') { acc.income += amount; acc.balance += amount; }
    else { acc.expense += amount; acc.balance -= amount; acc.categoryBreakdown[curr.category] = (acc.categoryBreakdown[curr.category] || 0) + amount; }
    return acc;
  }, { balance: 0, income: 0, expense: 0, categoryBreakdown: {} }), [transactions, selectedMonth]);

  const deleteTransaction = (id) => setTransactions(prev => prev.filter(t => t.id !== id));

  const CardsManager = () => {
    const [isAdding, setIsAdding] = useState(false);
    const [newCardName, setNewCardName] = useState('');
    const [newCardType, setNewCardType] = useState('credit');
    const [cardFilterMode, setCardFilterMode] = useState('mes');
    const [cardMonth, setCardMonth] = useState(selectedMonth);
    const [cardDateFrom, setCardDateFrom] = useState(() => { const d = new Date(); d.setDate(1); return d.toISOString().split('T')[0]; });
    const [cardDateTo, setCardDateTo] = useState(() => new Date().toISOString().split('T')[0]);
    const typeColors = { credit: 'from-purple-500 to-indigo-600', debit: 'from-blue-400 to-blue-600', cash: 'from-green-400 to-emerald-600', wallet: 'from-sky-400 to-cyan-600' };
    const typeLabels = { credit: 'Crédito', debit: 'Débito', cash: 'Efectivo', wallet: 'Billetera Virtual' };
    const currentMonthExpenses = useMemo(() => transactions.reduce((expenses, t) => {
      if (t.type === 'gasto' && isTransactionInSelectedMonth(t.date)) expenses[t.methodId] = (expenses[t.methodId] || 0) + (parseFloat(t.amount) || 0);
      return expenses;
    }, {}), [transactions, selectedMonth]);
    const handleAddCard = (e) => {
      e.preventDefault();
      if (!newCardName.trim()) return;
      setPaymentMethods(prev => [...prev, { id: Date.now(), name: newCardName.trim(), type: newCardType, color: typeColors[newCardType] || 'from-gray-500 to-gray-700' }]);
      setIsAdding(false); setNewCardName('');
    };
    const handleDeleteCard = (e, id) => { e.stopPropagation(); setPaymentMethods(prev => prev.filter(m => m.id !== id)); if (selectedCardId === id) setSelectedCardId(null); };
    if (selectedCardId !== null) {
      const card = paymentMethods.find(m => m.id === selectedCardId);
      const cardTransactions = transactions.filter(t => {
        if (t.methodId !== selectedCardId) return false;
        if (cardFilterMode === 'mes') { const d = new Date(t.date); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` === cardMonth; }
        if (cardFilterMode === 'periodo') { const time = new Date(t.date).getTime(); return time >= new Date(cardDateFrom + 'T00:00:00').getTime() && time <= new Date(cardDateTo + 'T23:59:59').getTime(); }
        return true;
      });
      return <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-right-4 duration-300">
        <div className="flex items-center gap-3 mb-4 mt-2"><button onClick={() => setSelectedCardId(null)} className="bg-gray-100 hover:bg-gray-200 text-gray-800 p-2 rounded-full transition-colors shadow-sm"><ArrowLeftIcon /></button><div><h1 className="text-xl font-bold text-gray-900">{card ? card.name : 'Detalle de Tarjeta'}</h1><p className="text-xs text-gray-500">{cardFilterMode === 'mes' ? 'Movimientos del mes' : cardFilterMode === 'periodo' ? 'Movimientos por período' : 'Todos los movimientos'}</p></div></div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4 space-y-3"><p className="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtros</p><div className="flex gap-2"><select value={cardFilterMode} onChange={e => setCardFilterMode(e.target.value)} className="bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none flex-1"><option value="mes">Mes Específico</option><option value="periodo">Rango de Fechas</option><option value="todos">Todo el tiempo</option></select>{cardFilterMode === 'mes' && <input type="month" value={cardMonth} onChange={e => setCardMonth(e.target.value)} className="bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none flex-1" />}</div>{cardFilterMode === 'periodo' && <div className="flex gap-2"><div className="flex-1"><label className="text-[10px] text-gray-500 font-bold block mb-1">Desde</label><input type="date" value={cardDateFrom} onChange={e => setCardDateFrom(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none" /></div><div className="flex-1"><label className="text-[10px] text-gray-500 font-bold block mb-1">Hasta</label><input type="date" value={cardDateTo} onChange={e => setCardDateTo(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none" /></div></div>}</div>
        <div className="space-y-3">{cardTransactions.length === 0 ? <div className="text-center text-gray-500 mt-6 text-sm bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">No hay movimientos registrados con los filtros seleccionados.</div> : cardTransactions.map(t => { const category = categories.find(c => c.id === t.category); return <div key={t.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center"><div className="flex items-center gap-3"><div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${t.type === 'ingreso' ? 'bg-green-100' : 'bg-red-100'}`}>{t.type === 'ingreso' ? <TrendingUpIcon /> : <TrendingDownIcon />}</div><div><p className="font-semibold text-gray-900 text-base">{t.description}</p><div className="flex items-center gap-2 mt-0.5"><span className="text-xs text-gray-500">{new Date(t.date).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' })}</span><span className="w-1 h-1 rounded-full bg-gray-300"/><span className="text-xs text-gray-500 capitalize">{category ? category.name : t.category}</span></div></div></div><div className="flex flex-col items-end"><span className={`font-bold ${t.type === 'ingreso' ? 'text-green-600' : 'text-gray-900'}`}>{t.type === 'ingreso' ? '+' : '-'}{formatCurrency(t.amount)}</span>{t.originalCurrency && t.originalCurrency !== settings.currency && <span className="text-[10px] text-gray-400">({t.originalCurrency} {new Intl.NumberFormat('es-AR').format(t.originalAmount)})</span>}</div></div>; })}</div>
      </div>;
    }
    return <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-bottom-4 duration-300">
      <div className="flex justify-between items-center mb-6 mt-2"><h1 className="text-2xl font-bold text-gray-900">Mis Tarjetas</h1><button onClick={() => setIsAdding(!isAdding)} className="bg-blue-100 text-blue-600 p-2 rounded-full hover:bg-blue-200 transition-colors shadow-sm"><PlusIcon active={false}/></button></div>

  const HistoryAndHabitual = () => {

    const [isAddingHabitual,setIsAddingHabitual]=useState(false); const [editingHabitualId,setEditingHabitualId]=useState(null); const [newHabName,setNewHabName]=useState(''); const [newHabAmount,setNewHabAmount]=useState(''); const [newHabInstallments,setNewHabInstallments]=useState('Mensual'); const [newHabAuto,setNewHabAuto]=useState(false); const [newHabCategory,setNewHabCategory]=useState(categories[0]?.id||''); const [newHabMethod,setNewHabMethod]=useState(paymentMethods[0]?.id||''); const [habDateMode,setHabDateMode]=useState('hoy'); const [habManualDate,setHabManualDate]=useState(()=>new Date().toISOString().split('T')[0]);

  const ProfileDashboard = () => {
    const currentIncome=useMemo(()=>transactions.filter(t=>t.type==='ingreso'&&isTransactionInSelectedMonth(t.date)).reduce((a,c)=>a+(parseFloat(c.amount)||0),0),[transactions,selectedMonth]);

    const savings=currentIncome-currentExpense; const savingsRate=currentIncome>0?(savings/currentIncome)*100:0; const bounded=Math.min(Math.max(savingsRate,0),100); const cardExpensePercent=useMemo(()=>{const cardExp=transactions.filter(t=>t.type==='gasto'&&isTransactionInSelectedMonth(t.date)).filter(t=>{const m=paymentMethods.find(x=>x.id===t.methodId);return m&&(m.type==='credit'||m.type==='debit');}).reduce((a,c)=>a+(parseFloat(c.amount)||0),0);return currentExpense>0?Math.round(cardExp/currentExpense*100):0;},[transactions,paymentMethods,selectedMonth,currentExpense]);

    const monthlyData=useMemo(()=>{const data=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;let inc=0,exp=0;transactions.forEach(t=>{const td=new Date(t.date);const tm=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}`;if(tm===m){if(t.type==='ingreso')inc+=parseFloat(t.amount)||0;else exp+=parseFloat(t.amount)||0;}});data.push({m,label:d.toLocaleString('es-ES',{month:'short'}),inc,exp});}return data;},[transactions]);
    const maxMonthly=Math.max(...monthlyData.map(d=>Math.max(d.inc,d.exp,1000)));
    return <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-right-4 duration-300"><div className="flex items-center gap-3 mb-6 mt-2"><button onClick={()=>setActiveTab('dashboard')} className="bg-gray-100 p-2 rounded-full"><ArrowLeftIcon/></button><div><h1 className="text-xl font-bold text-gray-900">Dashboard Personal</h1><p className="text-xs text-gray-500">Resumen Financiero Avanzado</p></div></div><div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-3xl p-5 text-white shadow-md mb-6"><div className="flex gap-3 items-start"><div className="p-2 bg-white/20 rounded-xl"><span className="font-black">i</span></div><div><h3 className="font-bold text-sm mb-1">¡Un dato sobre vos!</h3><p className="text-sm opacity-90">El <strong>{cardExpensePercent}%</strong> de tus gastos de este mes provienen de tarjetas.</p></div></div></div><div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6 flex flex-col items-center"><h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider w-full text-left mb-4">Tasa de Ahorro (Mes Actual)</h3><div className="relative w-48 h-24"><svg viewBox="0 0 100 50" className="w-full h-full"><path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#f3f4f6" strokeWidth="12" strokeLinecap="round"/><path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke={savingsRate>=20?'#34C759':savingsRate>0?'#F59E0B':'#FF3B30'} strokeWidth="12" strokeLinecap="round" strokeDasharray="125.6" strokeDashoffset={125.6-(bounded/100)*125.6}/></svg><div className="absolute bottom-0 w-full text-center"><span className="text-3xl font-black text-gray-800">{savingsRate.toFixed(1)}%</span></div></div><div className="w-full flex justify-between mt-4 text-xs font-semibold px-2"><div className="text-center"><span className="block text-green-500">Generado</span>{formatCurrency(currentIncome)}</div><div className="text-center"><span className="block text-blue-500">Ahorrado</span>{formatCurrency(Math.max(0,savings))}</div></div></div><div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6"><h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Composición del Gasto</h3><div className="space-y-3">{categoryExpenses.length===0?<p className="text-center text-xs text-gray-400">No hay gastos este mes.</p>:categoryExpenses.map(c=><div key={c.id}><div className="flex justify-between text-xs font-medium mb-1"><span className="text-gray-700">{c.name}</span><span className="text-gray-900">{formatCurrency(c.amount)} ({c.percentage.toFixed(1)}%)</span></div><div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden"><div className="bg-indigo-500 h-full rounded-full" style={{width:`${c.percentage}%`}}/></div></div>)}</div></div><div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100"><h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Evolución (6 Meses)</h3><div className="flex items-end justify-between h-40 gap-2">{monthlyData.map(d=><div key={d.m} className="flex flex-col items-center flex-1 gap-1"><div className="flex w-full gap-1 items-end h-full"><div className="bg-green-400 rounded-t-sm flex-1" style={{height:`${Math.max(d.inc/maxMonthly*100,2)}%`}}/><div className="bg-red-400 rounded-t-sm flex-1" style={{height:`${Math.max(d.exp/maxMonthly*100,2)}%`}}/></div><span className="text-[10px] text-gray-500 capitalize">{d.label}</span></div>)}</div><div className="flex justify-center gap-4 mt-4 text-[10px] font-medium text-gray-500"><span>● Ingresos</span><span>● Gastos</span></div></div></div>;

  const SettingsView = () => {

bmit" className="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm">Simular Conexión y Guardar</button></>}</form>}<div className="space-y-2">{bankAccounts.length===0&&!isLinkingBank&&<p className="text-center text-xs text-gray-400 py-2">No hay bancos vinculados.</p>}{bankAccounts.map(b=><div key={b.id} className="p-3 bg-gray-50 rounded-xl border border-gray-100"><div className="flex justify-between items-center"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><BuildingIcon/></div><div><p className="text-sm font-semibold text-gray-800">{b.bankName}</p><p className="text-[10px] text-gray-500">{b.accountType} • {formatCurrency(getBankBalance(b.id))}</p></div></div><button onClick={()=>handleDeleteBank(b.id)} className="text-red-400 p-2"><TrashIcon/></button></div><div className="mt-2 pt-2 border-t border-gray-200"><p className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Tarjetas vinculadas</p><div className="flex flex-wrap gap-1.5">{paymentMethods.filter(m=>m.bankId===b.id).map(c=><span key={c.id} className="text-[10px] bg-white border border-gray-200 text-gray-600 px-2 py-1 rounded-md flex items-center gap-1">💳 {c.name}<button onClick={()=>setPaymentMethods(prev=>prev.map(pm=>pm.id===c.id?{...pm,bankId:null}:pm))}>×</button></span>)}{paymentMethods.filter(m=>m.bankId!==b.id&&m.type!=='cash').length>0&&<button onClick={()=>{const c=paymentMethods.find(m=>m.bankId!==b.id&&m.type!=='cash');if(c)setPaymentMethods(prev=>prev.map(pm=>pm.id===c.id?{...pm,bankId:b.id}:pm));}} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-md">Vincular una tarjeta</button>}</div></div></div>)}</div></div>
