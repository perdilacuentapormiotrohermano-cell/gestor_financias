<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gestor de Finanzas</title>
  <link rel="manifest" href="manifest.json?v=21">
  <meta name="theme-color" content="#007AFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=21"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{margin:0;padding:0;background:#e5e7eb;overscroll-behavior:none;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .h-safe-top{height:env(safe-area-inset-top,0px)}
    .pb-safe{padding-bottom:env(safe-area-inset-bottom,0px)}
    .no-scrollbar::-webkit-scrollbar{display:none}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    button,input,select{font:inherit}
    .tap{transition:transform .12s ease}.tap:active{transform:scale(.97)}
    select{color:#111827 !important;background-color:#f9fafb !important;color-scheme:light}
    select option{color:#111827 !important;background-color:#fff !important}
    .app-dark select,.app-dark select option,.app-dark input[type="month"],.app-dark input[type="date"]{color:#e5e7eb !important;background-color:#1e293b !important;color-scheme:dark !important;-webkit-text-fill-color:#e5e7eb !important}
    .app-dark select option{background-color:#0f172a !important;color:#e5e7eb !important}
    .app-dark input[type="month"]::-webkit-datetime-edit,.app-dark input[type="date"]::-webkit-datetime-edit{color:#e5e7eb !important}
    .app-dark input[type="month"]::-webkit-datetime-edit-fields-wrapper,.app-dark input[type="date"]::-webkit-datetime-edit-fields-wrapper{color:#e5e7eb !important}
    .app-dark input[type="month"]::-webkit-datetime-edit-text,.app-dark input[type="date"]::-webkit-datetime-edit-text{color:#94a3b8 !important}
    .app-dark input[type="month"]::-webkit-calendar-picker-indicator,.app-dark input[type="date"]::-webkit-calendar-picker-indicator{filter:none;opacity:1}
    @media (prefers-color-scheme: dark){html,body{background:#020617}}
  </style>
</head>
<body>
  <div id="root"><div style="padding:40px 20px;text-align:center;color:#888">Cargando...</div></div>
  <div id="error-box" style="display:none;padding:16px;margin:16px;background:#fff0f0;border:1px solid #ffb3b3;border-radius:12px;color:#a30000;font-family:monospace;font-size:12px;white-space:pre-wrap"></div>
  <script>
    window.addEventListener('error',function(e){var box=document.getElementById('error-box');if(box){box.style.display='block';box.textContent='Error: '+e.message+'\n'+(e.filename?(e.filename+':'+e.lineno):'');}});
  </script>
  <script type="text/babel" data-presets="react" src="app.js?v=21"></script>
  <script>
    if ('serviceWorker' in navigator) {
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=21', { updateViaCache: 'none' }).then(function (reg) {
          return reg.update();
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
