<div id="root"><div style="padding:40px 20px;text-align:center;color:#888">Cargando...</div></div>

window.addEventListener('error',e=>{const b=document.getElementById('error-box');if(b){b.style.display='block';b.textContent='Error: '+e.message+'\n'+(e.filename?(e.filename+':'+e.lineno):'')}});
</script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo}=React;
const Icon=({children,size=22,color='currentColor',sw=2.2})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
const HomeIcon=({active})=><Icon color={active?'#007AFF':'#8E8E93'} sw={active?2.5:2}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
const PlusIcon=({active=false})=><Icon color={active?'white':'#007AFF'} sw={active?2.5:2.2}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const ListIcon=({active})=><Icon color={active?'#007AFF':'#8E8E93'} sw={active?2.5:2}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>;
const CardIcon=({active})=><Icon color={active?'#007AFF':'#8E8E93'} sw={active?2.5:2}><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></Icon>;
const SettingsIcon=({active})=><Icon color={active?'#007AFF':'#8E8E93'} sw={active?2.5:2}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
const TrashIcon=()=> <Icon size={18} color="#FF3B30"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
const EditIcon=()=> <Icon size={18}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
const UpIcon=()=> <Icon size={17}><polyline points="18 15 12 9 6 15"/></Icon>;
const DownIcon=()=> <Icon size={17}><polyline points="6 9 12 15 18 9"/></Icon>;
const BackIcon=()=> <Icon size={20}><polyline points="15 18 9 12 15 6"/></Icon>;
const BellIcon=()=> <Icon size={20} color="#FF9500"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Icon>;
const BuildingIcon=()=> <Icon size={19}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/></Icon>;
const TrendUp=()=> <Icon size={20} color="#34C759"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
const TrendDown=()=> <Icon size={20} color="#FF3B30"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></Icon>;

function ExpenseTrackerApp(){
 const [activeTab,setActiveTab]=useState('dashboard');
 const [subTab,setSubTab]=useState('historial');
 const [transactions,setTransactions]=useState([]),[paymentMethods,setPaymentMethods]=useState([]),[settings,setSettings]=useState({currency:'ARS'});
 const [categories,setCategories]=useState([]),[typesList,setTypesList]=useState([]),[commitments,setCommitments]=useState([]),[installmentTracks,setInstallmentTracks]=useState([]),[bankAccounts,setBankAccounts]=useState([]);
 const [selectedMonth,setSelectedMonth]=useState(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});
 const [isLoaded,setIsLoaded]=useState(false),[selectedCardId,setSelectedCardId]=useState(null);
 const defaults={
  methods:[{id:1,name:'Efectivo',type:'cash',color:'from-green-400 to-emerald-600'},{id:2,name:'Tarjeta Débito',type:'debit',color:'from-blue-400 to-blue-600'}],
  cats:[{id:'comida',name:'Comida',type:'gasto',budget:50000},{id:'transporte',name:'Transporte',type:'gasto',budget:30000},{id:'servicios',name:'Servicios',type:'gasto',budget:40000},{id:'sueldo',name:'Sueldo',type:'ingreso',budget:0}],
  types:[{id:'diario',name:'Diario'},{id:'mensual',name:'Mensual'},{id:'otro',name:'Otro'}]
 };
 useEffect(()=>{
  const read=(k,fallback)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch{return fallback}};
  setSettings(read('finance_settings',{currency:'ARS'}));setMethodsSafe(read('finance_methods',defaults.methods));setCategories(read('finance_categories',defaults.cats));setTypesList(read('finance_types',defaults.types));setCommitments(read('finance_commitments',[]));setInstallmentTracks(read('finance_installments_track',[]));setBankAccounts(read('finance_banks',[]));setTransactions(read('finance_data',[]));setIsLoaded(true);
 },[]);
 const setMethodsSafe=v=>setPaymentMethods(v);
 useEffect(()=>{if(!isLoaded)return;localStorage.setItem('finance_data',JSON.stringify(transactions));localStorage.setItem('finance_methods',JSON.stringify(paymentMethods));localStorage.setItem('finance_settings',JSON.stringify(settings));localStorage.setItem('finance_categories',JSON.stringify(categories));localStorage.setItem('finance_types',JSON.stringify(typesList));localStorage.setItem('finance_commitments',JSON.stringify(commitments));localStorage.setItem('finance_installments_track',JSON.stringify(installmentTracks));localStorage.setItem('finance_banks',JSON.stringify(bankAccounts));},[transactions,paymentMethods,settings,categories,typesList,commitments,installmentTracks,bankAccounts,isLoaded]);
 useEffect(()=>{if(!isLoaded||!installmentTracks.length)return;const now=new Date();let changed=false;const next=installmentTracks.map(q=>{if(!q.startDate||q.current>=q.total)return q;const start=new Date(q.startDate);let months=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());if(now.getDate()<start.getDate())months--;if(months<=0)return q;changed=true;const current=Math.min(q.total,(q.current||0)+months);const d=new Date(start);d.setMonth(d.getMonth()+months);return {...q,current,startDate:d.toISOString(),originalStartDate:q.originalStartDate||q.startDate}});if(changed)setInstallmentTracks(next)},[isLoaded,installmentTracks]);
 const formatAmountInput=val=>{if(!val)return'';let s=String(val).replace(/[^0-9,]/g,'');const p=s.split(',');if(p.length>2)return s;const i=p[0]?Number(p[0]).toLocaleString('es-AR'):'';return i+(p[1]!==undefined?','+p[1].slice(0,2):'')};
 const parseAmount=val=>{if(!val)return 0;return Number(String(val).replace(/\./g,'').replace(',','.'))||0};
 const formatCurrency=amount=>{const n=Number(amount)||0;return (settings.currency==='USD'?'US$ ':settings.currency==='EUR'?'€ ':'$ ')+new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)};
 const inSelectedMonth=date=>{const d=new Date(date);if(Number.isNaN(d.getTime()))return false;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===selectedMonth};
 const totals=useMemo(()=>transactions.filter(t=>inSelectedMonth(t.date)).reduce((a,t)=>{const n=Number(t.amount)||0;if(t.type==='ingreso'){a.income+=n;a.balance+=n}else{a.expense+=n;a.balance-=n;a.categoryBreakdown[t.category]=(a.categoryBreakdown[t.category]||0)+n}return a},{income:0,expense:0,balance:0,categoryBreakdown:{}}),[transactions,selectedMonth]);
 const globalBalance=useMemo(()=>{const base=bankAccounts.reduce((a,b)=>a+(Number(b.initialBalance!==undefined?b.initialBalance:b.balance)||0),0);const inc=transactions.filter(t=>t.type==='ingreso').reduce((a,t)=>a+(Number(t.amount)||0),0);const exp=transactions.filter(t=>t.type==='gasto').reduce((a,t)=>a+(Number(t.amount)||0),0);return base+inc-exp},[transactions,bankAccounts]);
 const bankBalance=id=>{const b=bankAccounts.find(x=>x.id===id);if(!b)return 0;let n=Number(b.initialBalance!==undefined?b.initialBalance:b.balance)||0;transactions.forEach(t=>{if(t.type==='ingreso'&&t.bankId===id)n+=Number(t.amount)||0;if(t.type==='gasto'){const m=paymentMethods.find(x=>x.id===t.methodId);if(m&&m.bankId===id)n-=Number(t.amount)||0}});return n};
 const deleteTransaction=id=>setTransactions(p=>p.filter(t=>t.id!==id));

 const Dashboard=()=>{const today=new Date(),day=today.getDate();const upcoming=commitments.filter(c=>{const d=Number(c.dueDay||1);return d>=day&&d<=day+5});const [y,m]=selectedMonth.split('-');const monthName=new Date(Number(y),Number(m)-1,1).toLocaleString('es-ES',{month:'long',year:'numeric'});return <div className="p-4 pb-24 space-y-6">
  <div className="flex justify-between items-center"><div><h1 className="text-2xl font-bold text-gray-900">Mi Billetera</h1><p className="text-sm text-gray-500 capitalize">{monthName}</p></div><button onClick={()=>setActiveTab('profile')} className="w-10 h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-600 font-bold tap">PF</button></div>
  {upcoming.length>0&&<div className="bg-orange-50 border border-orange-200 rounded-2xl p-4 flex gap-3"><BellIcon/><div><b className="text-sm text-orange-800">Próximos vencimientos</b>{upcoming.map(c=><p key={c.id} className="text-xs text-orange-700 mt-1">{c.name} · {formatCurrency(c.amount)} · día {c.dueDay}</p>)}</div></div>}
  <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-6 text-white shadow-lg"><p className="text-blue-100 text-sm">Balance Total</p><h2 className="text-3xl font-bold mt-1 mb-6">{formatCurrency(globalBalance)}</h2><div className="grid grid-cols-2 gap-4 border-t border-white/20 pt-4"><div><p className="text-blue-100 text-xs">Ingresos</p><b>{formatCurrency(totals.income)}</b></div><div><p className="text-blue-100 text-xs">Gastos</p><b>{formatCurrency(totals.expense)}</b></div></div></div>
  {bankAccounts.length>0&&<div><h3 className="text-lg font-bold text-gray-800 mb-3">Cuentas vinculadas</h3><div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">{bankAccounts.map(b=><div key={b.id} className="min-w-[170px] bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="flex items-center gap-2"><span className="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><BuildingIcon/></span><b className="text-sm truncate">{b.bankName}</b></div><p className="text-[10px] text-gray-500 mt-2 uppercase">{b.accountType}</p><p className="font-bold text-lg mt-1">{formatCurrency(bankBalance(b.id))}</p></div>)}<button onClick={()=>setActiveTab('settings')} className="min-w-[170px] border-2 border-dashed border-gray-200 rounded-2xl text-xs text-gray-500 font-semibold tap">+ Vincular otra</button></div></div>}
  <div><div className="flex justify-between items-center mb-3"><h3 className="text-lg font-bold text-gray-800">Presupuestos</h3><button onClick={()=>setActiveTab('settings')} className="text-xs text-blue-600 font-semibold">Administrar</button></div><div className="space-y-3">{categories.filter(c=>c.type==='gasto').map(c=>{const spent=totals.categoryBreakdown[c.id]||0,b=c.budget||0,p=b>0?Math.min(spent/b*100,100):0,over=b>0&&spent>b;return <div key={c.id} className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><div className="flex justify-between text-sm mb-2"><span className="font-semibold">{c.name}</span><span>{formatCurrency(spent)} <span className="text-gray-400">/ {b>0?formatCurrency(b):'Sin límite'}</span></span></div>{b>0&&<div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className={'h-full rounded-full '+(over?'bg-red-500':p>80?'bg-orange-400':'bg-blue-500')} style={{width:p+'%'}}/></div>}</div>})}</div></div>
  <div><div className="flex justify-between items-center mb-3"><h3 className="text-lg font-bold text-gray-800">Actividad reciente</h3><button onClick={()=>{setSubTab('historial');setActiveTab('history')}} className="text-sm text-blue-600 font-semibold">Ver todo</button></div><div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">{transactions.filter(t=>inSelectedMonth(t.date)).slice(0,5).map(t=><div key={t.id} className="p-4 border-b border-gray-50 last:border-0 flex items-center justify-between"><div className="flex items-center gap-3"><div className={'w-10 h-10 rounded-full flex items-center justify-center '+(t.type==='ingreso'?'bg-green-100':'bg-red-100')}>{t.type==='ingreso'?<TrendUp/>:<TrendDown/>}</div><div><p className="font-semibold text-gray-800">{t.description}</p><p className="text-xs text-gray-500">{categories.find(c=>c.id===t.category)?.name||t.category}{t.typeClassification?' · '+t.typeClassification:''}</p></div></div><b className={t.type==='ingreso'?'text-green-600':'text-gray-900'}>{t.type==='ingreso'?'+':'-'}{formatCurrency(t.amount)}</b></div>)}{transactions.filter(t=>inSelectedMonth(t.date)).length===0&&<p className="p-6 text-center text-gray-500 text-sm">No hay movimientos este mes.</p>}</div></div>
 </div>};

 const AddTransaction=()=>{const [type,setType]=useState('gasto'),[amount,setAmount]=useState(''),[description,setDescription]=useState('');const available=categories.filter(c=>c.type===type);const [category,setCategory]=useState(available[0]?.id||'');const [classification,setClassification]=useState(typesList[0]?.id||'');const [method,setMethod]=useState(paymentMethods[0]?.id||'');const [bankId,setBankId]=useState('');const [dateMode,setDateMode]=useState('hoy');const [manualDate,setManualDate]=useState(new Date().toISOString().slice(0,10));const [currency,setCurrency]=useState(settings.currency),[rate,setRate]=useState(''),[loadingRate,setLoadingRate]=useState(false);
  useEffect(()=>{setCategory(available[0]?.id||'')},[type,categories]);useEffect(()=>{if(currency===settings.currency){setRate('');return}setLoadingRate(true);fetch('https://open.er-api.com/v6/latest/'+currency).then(r=>r.json()).then(d=>{if(d?.rates?.[settings.currency])setRate(formatAmountInput(String(d.rates[settings.currency]).replace('.',',')))}).catch(()=>{}).finally(()=>setLoadingRate(false))},[currency,settings.currency]);
  const dateSave=()=>{const now=new Date();if(dateMode==='hoy')return now.toISOString();if(dateMode==='ayer')return new Date(now.getTime()-86400000).toISOString();if(dateMode==='hace2')return new Date(now.getTime()-172800000).toISOString();return new Date(manualDate+'T00:00:00').toISOString()};
  const submit=e=>{e.preventDefault();const original=parseAmount(amount);if(original<=0||!description.trim()||!category)return;const r=currency===settings.currency?1:parseAmount(rate)||1;setTransactions(p=>[{id:Date.now(),type,amount:original*r,originalAmount:original,originalCurrency:currency,exchangeRate:r,description:description.trim(),category,typeClassification:classification,methodId:type==='gasto'?(method||null):null,bankId:type==='ingreso'?(bankId||null):null,date:dateSave()},...p]);setActiveTab('dashboard')};
  const dateButton=(mode,label)=>{const d=mode==='hoy'?new Date():mode==='ayer'?new Date(Date.now()-86400000):new Date(Date.now()-172800000);return <button type="button" onClick={()=>setDateMode(mode)} className={'rounded-xl border p-2 '+(dateMode===mode?'bg-blue-50 border-blue-200 text-blue-700':'bg-gray-50 border-gray-200 text-gray-600')}><b className="block text-xs">{String(d.getDate()).padStart(2,'0')}/{String(d.getMonth()+1).padStart(2,'0')}</b><span className="text-[10px]">{label}</span></button>};
  return <div className="p-4 pb-24"><h1 className="text-2xl font-bold mb-6">Nuevo Movimiento</h1><form onSubmit={submit} className="space-y-4">
   <div className="bg-gray-200/70 p-1 rounded-xl flex"><button type="button" onClick={()=>setType('gasto')} className={'flex-1 py-2 rounded-lg text-sm '+(type==='gasto'?'bg-white shadow-sm font-semibold':'text-gray-500')}>Gasto</button><button type="button" onClick={()=>setType('ingreso')} className={'flex-1 py-2 rounded-lg text-sm '+(type==='ingreso'?'bg-white shadow-sm font-semibold':'text-gray-500')}>Ingreso</button></div>
   <div className="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm"><div className="flex justify-between mb-2"><span className="text-sm text-gray-500">Importe</span><select value={currency} onChange={e=>setCurrency(e.target.value)} className="bg-gray-100 rounded-lg px-2 py-1 text-xs font-bold"><option>ARS</option><option>USD</option><option>EUR</option></select></div><div className="flex items-center justify-center text-4xl font-bold"><span className="text-gray-400 mr-1">{currency==='USD'?'U$S':currency==='EUR'?'€':'$'}</span><input className="w-full max-w-[240px] bg-transparent outline-none text-center" value={amount} onChange={e=>setAmount(formatAmountInput(e.target.value))} placeholder="0,00" inputMode="decimal" required autoFocus/></div>{currency!==settings.currency&&<div className="mt-4 pt-4 border-t border-gray-100"><label className="text-xs text-gray-500 font-semibold">Tipo de cambio {loadingRate&&<span className="text-blue-500"> · consultando…</span>}</label><div className="flex items-center mt-1 bg-gray-50 rounded-xl px-3"><span className="text-xs font-bold mr-2">1 {currency}=</span><input className="bg-transparent outline-none flex-1 p-3 text-sm" value={rate} onChange={e=>setRate(e.target.value.replace(/[^0-9,]/g,''))} placeholder="1000,00" required/><span className="text-xs font-bold">{settings.currency}</span></div></div>}</div>
   <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><label className="text-xs text-gray-500 font-semibold uppercase">Descripción</label><input className="w-full mt-2 bg-gray-50 rounded-xl p-3 outline-none" value={description} onChange={e=>setDescription(e.target.value)} placeholder="Ej. Supermercado, Sueldo" required/></div>
   <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><label className="text-xs text-gray-500 font-semibold uppercase">Fecha</label><div className="grid grid-cols-4 gap-2 mt-2">{dateButton('hoy','Hoy')}{dateButton('ayer','Ayer')}{dateButton('hace2','Hace 2 días')}<button type="button" onClick={()=>setDateMode('manual')} className={'rounded-xl border p-2 '+(dateMode==='manual'?'bg-blue-50 border-blue-200 text-blue-700':'bg-gray-50 border-gray-200 text-gray-600')}><b className="block text-xs">{manualDate.slice(8,10)}/{manualDate.slice(5,7)}</b><span className="text-[10px]">Otra</span></button></div>{dateMode==='manual'&&<input type="date" className="w-full mt-2 bg-gray-50 rounded-xl p-3 text-sm" value={manualDate} onChange={e=>setManualDate(e.target.value)}/>}</div>

 const Settings=()=>{const [addCat,setAddCat]=useState(false),[catName,setCatName]=useState(''),[catType,setCatType]=useState('gasto'),[catBudget,setCatBudget]=useState('');const [edit,setEdit]=useState(null);const [addType,setAddType]=useState(false),[typeName,setTypeName]=useState('');const [link,setLink]=useState(false),[bankName,setBankName]=useState('BBVA'),[accountType,setAccountType]=useState('Caja de Ahorro'),[balance,setBalance]=useState('');const addCategory=e=>{e.preventDefault();if(!catName.trim())return;setCategories(p=>[...p,{id:'cat_'+Date.now(),name:catName.trim(),type:catType,budget:parseAmount(catBudget)}]);setCatName('');setCatBudget('');setAddCat(false)};const saveEdit=e=>{e.preventDefault();if(!edit.name.trim())return;setCategories(p=>p.map(c=>c.id===edit.id?{...c,...edit,budget:parseAmount(edit.budget)}:c));setEdit(null)};const addMovementType=e=>{e.preventDefault();if(!typeName.trim())return;setTypesList(p=>[...p,{id:'type_'+Date.now(),name:typeName.trim()}]);setTypeName('');setAddType(false)};const addBank=e=>{e.preventDefault();const b=parseAmount(balance);if(b<0)return;setBankAccounts(p=>[...p,{id:'bank_'+Date.now(),bankName,accountType,initialBalance:b,balance:b}]);setBalance('');setLink(false)};return <div className="p-4 pb-24"><h1 className="text-2xl font-bold mb-6">Ajustes</h1><div className="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm mb-5"><h3 className="text-xs uppercase font-bold text-blue-600 mb-4">General</h3><label className="text-xs text-gray-500 font-semibold">Mes seleccionado</label><input type="month" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="w-full bg-gray-50 rounded-xl p-3 mt-1 mb-3"/><label className="text-xs text-gray-500 font-semibold">Moneda base</label><select value={settings.currency} onChange={e=>setSettings({...settings,currency:e.target.value})} className="w-full bg-gray-50 rounded-xl p-3 mt-1"><option value="ARS">Peso Argentino (ARS)</option><option value="USD">Dólar (USD)</option><option value="EUR">Euro (EUR)</option></select></div><div className="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm mb-5"><div className="flex justify-between items-center mb-4"><h3 className="text-xs uppercase font-bold text-blue-600">Categorías y presupuestos</h3><button onClick={()=>setAddCat(!addCat)} className="bg-blue-100 text-blue-700 px-3 py-2 rounded-xl text-xs font-bold">+ Añadir</button></div>{addCat&&<form onSubmit={addCategory} className="bg-gray-50 p-4 rounded-2xl mb-4 space-y-2"><input value={catName} onChange={e=>setCatName(e.target.value)} placeholder="Nombre" className="w-full bg-white border border-gray-200 rounded-xl p-3" required/><div className="grid grid-cols-2 gap-2"><select value={catType} onChange={e=>setCatType(e.target.value)} className="bg-white border border-gray-200 rounded-xl p-3"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select><input value={catBudget} onChange={e=>setCatBudget(formatAmountInput(e.target.value))} placeholder="Presupuesto" className="bg-white border border-gray-200 rounded-xl p-3"/></div><button className="w-full bg-blue-600 text-white rounded-xl py-3 font-semibold">Guardar</button></form>}{categories.map((c,i)=>edit?.id===c.id?<form key={c.id} onSubmit={saveEdit} className="bg-blue-50 p-3 rounded-xl mb-2 space-y-2"><input value={edit.name} onChange={e=>setEdit({...edit,name:e.target.value})} className="w-full bg-white rounded-lg p-2"/><select value={edit.type} onChange={e=>setEdit({...edit,type:e.target.value})} className="w-full bg-white rounded-lg p-2"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select><input value={edit.budget} onChange={e=>setEdit({...edit,budget:e.target.value})} placeholder="Presupuesto" className="w-full bg-white rounded-lg p-2"/><div className="flex gap-2"><button type="button" onClick={()=>setEdit(null)} className="flex-1 bg-gray-200 rounded-lg py-2">Cancelar</button><button className="flex-1 bg-blue-600 text-white rounded-lg py-2">Guardar</button></div></form>:<div key={c.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl mb-2"><div className="flex items-center gap-2"><div className="flex flex-col"><button disabled={i===0} onClick={()=>setCategories(p=>{const n=[...p];[n[i-1],n[i]]=[n[i],n[i-1]];return n})} className="text-gray-400 disabled:opacity-30"><UpIcon/></button><button disabled={i===categories.length-1} onClick={()=>setCategories(p=>{const n=[...p];[n[i+1],n[i]]=[n[i],n[i+1]];return n})} className="text-gray-400 disabled:opacity-30"><DownIcon/></button></div><div><b className="text-sm">{c.name}</b><p className="text-[10px] text-gray-500">{c.type}{c.budget>0?' · '+formatCurrency(c.budget):''}</p></div></div><div className="flex"><button onClick={()=>setEdit({...c,budget:String(c.budget||'')})} className="p-2 text-blue-500"><EditIcon/></button><button onClick={()=>setCategories(p=>p.filter(x=>x.id!==c.id))} className="p-2"><TrashIcon/></button></div></div>)}</div><div className="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm mb-5"><div className="flex justify-between items-center mb-4"><h3 className="text-xs uppercase font-bold text-blue-600">Tipos de movimiento</h3><button onClick={()=>setAddType(!addType)} className="bg-blue-100 text-blue-700 px-3 py-2 rounded-xl text-xs font-bold">+ Añadir</button></div>{addType&&<form onSubmit={addMovementType} className="flex gap-2 mb-3"><input value={typeName} onChange={e=>setTypeName(e.target.value)} placeholder="Ej. Semestral" className="flex-1 bg-gray-50 rounded-xl p-3" required/><button className="bg-blue-600 text-white px-4 rounded-xl">OK</button></form>}{typesList.map(t=><div key={t.id} className="flex justify-between items-center bg-gray-50 rounded-xl p-3 mb-2"><span className="text-sm font-semibold">{t.name}</span><button onClick={()=>setTypesList(p=>p.filter(x=>x.id!==t.id))}><TrashIcon/></button></div>)}</div><div className="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm"><div className="flex justify-between items-center mb-4"><div><h3 className="text-xs uppercase font-bold text-blue-600">Cuentas bancarias</h3><p className="text-[10px] text-gray-400">Gestión manual / prototipo</p></div><button onClick={()=>setLink(!link)} className="bg-blue-100 text-blue-700 px-3 py-2 rounded-xl text-xs font-bold">{link?'Cancelar':'+ Vincular Banco'}</button></div>{link&&<form onSubmit={addBank} className="bg-gray-50 p-4 rounded-2xl mb-4 space-y-2"><select value={bankName} onChange={e=>setBankName(e.target.value)} className="w-full bg-white rounded-xl p-3"><option>Galicia</option><option>Santander</option><option>BBVA</option><option>Brubank</option><option>Mercado Pago</option><option>Macro</option><option>Nación</option></select><div className="grid grid-cols-2 gap-2"><select value={accountType} onChange={e=>setAccountType(e.target.value)} className="bg-white rounded-xl p-3"><option>Caja de Ahorro</option><option>Cuenta Sueldo</option><option>Cuenta Corriente</option></select><input value={balance} onChange={e=>setBalance(formatAmountInput(e.target.value))} placeholder="Saldo actual" className="bg-white rounded-xl p-3" required/></div><button className="w-full bg-blue-600 text-white rounded-xl py-3 font-semibold">Guardar cuenta</button></form>}{bankAccounts.map(b=><div key={b.id} className="bg-gray-50 rounded-xl p-3 mb-2"><div className="flex justify-between items-center"><div className="flex items-center gap-2"><span className="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><BuildingIcon/></span><div><b className="text-sm">{b.bankName}</b><p className="text-[10px] text-gray-500">{b.accountType} · {formatCurrency(bankBalance(b.id))}</p></div></div><button onClick={()=>setBankAccounts(p=>p.filter(x=>x.id!==b.id))}><TrashIcon/></button></div></div>)}{!bankAccounts.length&&!link&&<p className="text-center text-xs text-gray-400">No hay bancos vinculados.</p>}</div></div>};

 if(!isLoaded)return null;return <div className="bg-gray-200 min-h-screen flex justify-center"><div className="w-full max-w-md min-h-screen bg-gray-50 relative flex flex-col shadow-2xl"><div className="h-safe-top bg-gray-50"/><main className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar">{activeTab==='dashboard'&&<Dashboard/>}{activeTab==='profile'&&<Profile/>}{activeTab==='cards'&&<Cards/>}{activeTab==='add'&&<AddTransaction/>}{activeTab==='history'&&<History/>}{activeTab==='settings'&&<Settings/>}</main><nav className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 pb-safe z-50"><div className="h-20 flex items-center justify-between px-4 pb-3"><button onClick={()=>{setActiveTab('dashboard');setSelectedCardId(null)}} className="w-12 flex flex-col items-center gap-1"><HomeIcon active={activeTab==='dashboard'}/><span className="text-[10px] text-gray-500">Inicio</span></button><button onClick={()=>{setActiveTab('cards');setSelectedCardId(null)}} className="w-12 flex flex-col items-center gap-1"><CardIcon active={activeTab==='cards'}/><span className="text-[10px] text-gray-500">Tarjetas</span></button><button onClick={()=>{setActiveTab('add');setSelectedCardId(null)}} className="w-16 -mt-8"><div className="w-14 h-14 mx-auto rounded-full bg-blue-600 flex items-center justify-center border-4 border-gray-50 shadow-lg tap"><PlusIcon active/></div></button><button onClick={()=>{setActiveTab('history');setSelectedCardId(null)}} className="w-12 flex flex-col items-center gap-1"><ListIcon active={activeTab==='history'}/><span className="text-[10px] text-gray-500">Historial</span></button><button onClick={()=>{setActiveTab('settings');setSelectedCardId(null)}} className="w-12 flex flex-col items-center gap-1"><SettingsIcon active={activeTab==='settings'}/><span className="text-[10px] text-gray-500">Ajustes</span></button></div></nav></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ExpenseTrackerApp/>);
</script>
