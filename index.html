<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gestor de Finanzas</title>
  <link rel="manifest" href="manifest.json?v=9">
  <meta name="theme-color" content="#007AFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{margin:0;padding:0;background:#e5e7eb;overscroll-behavior:none;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .h-safe-top{height:env(safe-area-inset-top,0px)}
    .pb-safe{padding-bottom:env(safe-area-inset-bottom,0px)}
    .no-scrollbar::-webkit-scrollbar{display:none}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    button,input,select{font:inherit}
    .tap{transition:transform .12s ease}.tap:active{transform:scale(.97)}
    select{color:#111827 !important;background-color:#fff !important;color-scheme:light}
    select option{color:#111827 !important;background-color:#fff !important}
    select[class*="bg-slate-800"],select[class*="bg-slate-900"],select[class*="text-slate-200"]{color:#e5e7eb !important;background-color:#1e293b !important;color-scheme:dark}
    select[class*="bg-slate-800"] option,select[class*="bg-slate-900"] option,select[class*="text-slate-200"] option{color:#e5e7eb !important;background-color:#0f172a !important}
    input[type="month"],input[type="date"]{color-scheme:light}
  </style>
</head>
<body>
  <div id="root"><div style="padding:40px 20px;text-align:center;color:#888">Cargando...</div></div>
  <div id="error-box" style="display:none;padding:16px;margin:16px;background:#fff0f0;border:1px solid #ffb3b3;border-radius:12px;color:#a30000;font-family:monospace;font-size:12px;white-space:pre-wrap"></div>
  <script>
    window.addEventListener('error',function(e){
      var box=document.getElementById('error-box');
      if(box){box.style.display='block';box.textContent='Error: '+e.message+'\n'+(e.filename?(e.filename+':'+e.lineno):'');}
    });
  </script>
  <script>
    (function(){
      var originalCreateElement=React.createElement;
      React.createElement=function(type,props){
        var children=Array.prototype.slice.call(arguments,2);
        if(type === '') type=React.Fragment;
        return originalCreateElement.apply(React,[type,props].concat(children));
      };
    })();
  </script>
  <script src="app.js?v=9"></script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('sw.js?v=9',{updateViaCache:'none'}).then(function(reg){return reg.update();}).catch(function(){});
      });
    }
  </script>
</body>
</html>
