            <button 
              type="button"
              onClick={() => setIsLinkingBank(!isLinkingBank)}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors shadow-sm ${isLinkingBank ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}
            >
              {isLinkingBank ? 'Cancelar' : '+ Vincular Banco'}
            </button>
          </div>

          {isLinkingBank && (
            <form onSubmit={handleLinkBank} className="mb-4 bg-gray-50 p-4 rounded-2xl border border-gray-100 animate-in zoom-in-95 duration-200">
              {isSimulatingSync ? (
                <div className="flex flex-col items-center justify-center py-6 space-y-3">
                  <div className="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                  <p className="text-sm font-semibold text-gray-600">Estableciendo conexión segura...</p>
                </div>
              ) : (
                <>
                  <p className="text-xs font-semibold text-gray-800 mb-3">Conexión Bancaria</p>
                  
                  <label className="text-[10px] text-gray-500 font-bold block mb-1">Entidad Bancaria</label>
                  <select value={newBankName} onChange={e => setNewBankName(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full mb-3 bg-white outline-none">
                    <option value="Galicia">Banco Galicia</option>
                    <option value="Santander">Santander</option>
                    <option value="BBVA">BBVA</option>
                    <option value="Brubank">Brubank</option>
                    <option value="Mercado Pago">Mercado Pago (CVU)</option>
                    <option value="Macro">Banco Macro</option>
                    <option value="Nación">Banco Nación</option>
                  </select>

                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <div>
                      <label className="text-[10px] text-gray-500 font-bold block mb-1">Tipo de Cuenta</label>
                      <select value={newBankAccountType} onChange={e => setNewBankAccountType(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full bg-white outline-none">
                        <option value="Caja de Ahorro">Caja de Ahorro</option>
                        <option value="Cuenta Sueldo">Cuenta Sueldo</option>
                        <option value="Cuenta Corriente">Cuenta Corriente</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] text-gray-500 font-bold block mb-1">Saldo Actual</label>
                      <input type="text" placeholder="Ej. 150000" value={newBankBalance} onChange={e => setNewBankBalance(formatAmountInput(e.target.value))} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full outline-none" required inputMode="decimal" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md shadow-blue-500/20 active:scale-95 transition-transform">
                    Simular Conexión y Guardar
                  </button>
                  <p className="text-[9px] text-gray-400 mt-2 text-center leading-tight">
                    *Nota: En esta versión prototipo la sincronización es manual. En una app real de producción, aquí se usaría un proveedor de Open Banking como Prometeo o Belvo.
                  </p>
                </>
              )}
            </form>
          )}

          <div className="space-y-2">
            {bankAccounts.length === 0 && !isLinkingBank && (
              <p className="text-center text-xs text-gray-400 py-2">No hay bancos vinculados.</p>
            )}
            {bankAccounts.map(b => {
              const linkedCards = paymentMethods.filter(m => m.bankId === b.id);
              const unlinkedCards = paymentMethods.filter(m => m.bankId !== b.id && m.type !== 'cash');
              
              return (
              <div key={b.id} className="flex flex-col p-3 bg-gray-50 rounded-xl border border-gray-100">
                <div className="flex justify-between items-center mb-2">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                      <BuildingIcon />
                    </div>
                    <div>
                      <p className="text-sm font-semibold text-gray-800">{b.bankName}</p>
                      <p className="text-[10px] text-gray-500 font-medium">{b.accountType} • {formatCurrency(getBankBalance(b.id))}</p>
                    </div>
                  </div>
                  <button onClick={() => handleDeleteBank(b.id)} className="text-red-400 p-2 hover:bg-red-50 rounded-lg"><TrashIcon /></button>
                </div>

                <div className="mt-2 pt-2 border-t border-gray-200">
                    <p className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Tarjetas Vinculadas</p>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                        {linkedCards.length === 0 && <span className="text-[10px] text-gray-400">Ninguna tarjeta vinculada</span>}
                        {linkedCards.map(c => (
                            <span key={c.id} className="text-[10px] bg-white border border-gray-200 text-gray-600 px-2 py-1 rounded-md flex items-center gap-1 shadow-sm">
                                💳 {c.name}
                                <button onClick={() => setPaymentMethods(paymentMethods.map(pm => pm.id === c.id ? {...pm, bankId: null} : pm))} className="text-gray-400 hover:text-red-500 ml-1 font-bold text-xs">×</button>
                            </span>
                        ))}
                    </div>
                    {unlinkedCards.length > 0 && (
                        <div className="flex gap-2 items-center mt-1">
                            <select 
                                id={`select_card_${b.id}`}
                                className="text-[10px] p-1.5 rounded-lg border border-gray-200 outline-none flex-1 bg-white text-gray-700"
                            >
                                <option value="">Vincular otra tarjeta...</option>
                                {unlinkedCards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                            <button 
                                onClick={() => {
                                    const selectEl = document.getElementById(`select_card_${b.id}`);
                                    const cardId = Number(selectEl.value);
                                    if(cardId) {
                                        setPaymentMethods(paymentMethods.map(pm => pm.id === cardId ? {...pm, bankId: b.id} : pm));
                                        selectEl.value = '';
                                    }
                                }}
                                className="bg-gray-200 text-gray-700 px-2 py-1.5 rounded-lg text-[10px] font-bold hover:bg-gray-300 transition-colors"
                            >
                                Vincular
                            </button>
                        </div>
                    )}
                </div>
              </div>
            )})}
          </div>
        </div>

      </div>
    );
  };

  if (!isLoaded) return null;

  return (
    <div className="bg-gray-200 min-h-screen flex justify-center font-sans">
      <div className="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col">
        <div className="w-full h-safe-top pt-8 bg-gray-50"></div>

        <div className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar">
          {activeTab === 'dashboard' && <Dashboard />}
          {activeTab === 'profile' && <ProfileDashboard />}
          {activeTab === 'cards' && <CardsManager />}
          {activeTab === 'add' && <AddTransaction />}
          {activeTab === 'history' && <HistoryAndHabitual />}
          {activeTab === 'settings' && <SettingsView />}
        </div>

        <div className="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-50">
          <div className="flex justify-between items-center h-20 px-4 pb-4 pt-2">
            <button onClick={() => { setActiveTab('dashboard'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <HomeIcon active={activeTab === 'dashboard' && selectedCardId === null} />
              <span className={`text-[10px] font-medium ${activeTab === 'dashboard' && selectedCardId === null ? 'text-blue-600' : 'text-gray-500'}`}>Inicio</span>
            </button>

            <button onClick={() => { setActiveTab('cards'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <CreditCardIcon active={activeTab === 'cards'} />
              <span className={`text-[10px] font-medium ${activeTab === 'cards' ? 'text-blue-600' : 'text-gray-500'}`}>Tarjetas</span>
            </button>

            <button onClick={() => { setActiveTab('add'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center -mt-8 relative w-16">
              <div className="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 text-white transform transition-transform active:scale-95 border-4 border-gray-50 absolute">
                <PlusIcon active={true} />
              </div>
            </button>

            <button onClick={() => { setActiveTab('history'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <ListIcon active={activeTab === 'history'} />
              <span className={`text-[10px] font-medium ${activeTab === 'history' ? 'text-blue-600' : 'text-gray-500'}`}>Historial</span>
            </button>

            <button onClick={() => { setActiveTab('settings'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <SettingsIcon active={activeTab === 'settings'} />
              <span className={`text-[10px] font-medium ${activeTab === 'settings' ? 'text-blue-600' : 'text-gray-500'}`}>Ajustes</span>
            </button>
          </div>
        </div>
        
        <style dangerouslySetInnerHTML={{__html: `
          .no-scrollbar::-webkit-scrollbar { display: none; }
          .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        `}} />
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ExpenseTrackerApp />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
