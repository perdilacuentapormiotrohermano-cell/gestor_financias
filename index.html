<!-- PWA / "instalar como app" -->
<link rel="manifest" href="manifest.json" />

  html, body { margin:0; padding:0; background:#e5e7eb; overscroll-behavior:none; }
  .h-safe-top { height: env(safe-area-inset-top, 0px); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,stage-3">
const { useState, useEffect, useMemo } = React;


const HomeIcon = ({ active }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round">

    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </svg>
);

const PlusIcon = ({ active }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
);

const ListIcon = ({ active }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"></line>
    <line x1="8" y1="12" x2="21" y2="12"></line>
    <line x1="8" y1="18" x2="21" y2="18"></line>
    <line x1="3" y1="6" x2="3.01" y2="6"></line>
    <line x1="3" y1="12" x2="3.01" y2="12"></line>
    <line x1="3" y1="18" x2="3.01" y2="18"></line>
  </svg>
);

const TrashIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
  </svg>
);

const EditIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
  </svg>
);

const TrendingUpIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34C759" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
    <polyline points="16 7 22 7 22 13"></polyline>
  </svg>
);

const TrendingDownIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline>
    <polyline points="16 17 22 17 22 11"></polyline>
  </svg>
);

const CreditCardIcon = ({ active }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round">
    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
    <line x1="1" y1="10" x2="23" y2="10"></line>
  </svg>
);

const SettingsIcon = ({ active }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active ? "#007AFF" : "#8E8E93"} strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
);

const BellIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9500" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </svg>
);

const ArrowUpIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
);

const ArrowDownIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
);

const ArrowLeftIcon = () => (
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
);

function ExpenseTrackerApp() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [subTab, setSubTab] = useState('historial'); // shared subTab state lifted up
  const [transactions, setTransactions] = useState([]);
  const [paymentMethods, setPaymentMethods] = useState([]);
  
  const [settings, setSettings] = useState({ currency: 'ARS' });
  const [selectedMonth, setSelectedMonth] = useState(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  });
  const [categories, setCategories] = useState([]);
  const [typesList, setTypesList] = useState([]);
  const [commitments, setCommitments] = useState([]);
  const [installmentTracks, setInstallmentTracks] = useState([]);
  const [isLoaded, setIsLoaded] = useState(false);
  const [selectedCardId, setSelectedCardId] = useState(null);

  useEffect(() => {
    const savedData = localStorage.getItem('finance_data');
    const savedMethods = localStorage.getItem('finance_methods');
    const savedSettings = localStorage.getItem('finance_settings');
    const savedCategories = localStorage.getItem('finance_categories');
    const savedTypes = localStorage.getItem('finance_types');
    const savedCommitments = localStorage.getItem('finance_commitments');
    const savedInstallmentTracks = localStorage.getItem('finance_installments_track');
    
    if (savedSettings) try { setSettings(JSON.parse(savedSettings)); } catch (e) {}
    
    if (savedTypes) {
      try { setTypesList(JSON.parse(savedTypes)); } catch (e) {}
    } else {
      setTypesList([
        { id: 'diario', name: 'Diario' },
        { id: 'mensual', name: 'Mensual' },
        { id: 'otro', name: 'Otro' }
      ]);
    }

    if (savedCategories) {
      try { setCategories(JSON.parse(savedCategories)); } catch (e) {}
    } else {
      setCategories([
        { id: 'comida', name: 'Comida', type: 'gasto', budget: 50000 },
        { id: 'transporte', name: 'Transporte', type: 'gasto', budget: 30000 },
        { id: 'servicios', name: 'Servicios', type: 'gasto', budget: 40000 },
        { id: 'sueldo', name: 'Sueldo', type: 'ingreso', budget: 0 }
      ]);
    }
    
    if (savedCommitments) try { setCommitments(JSON.parse(savedCommitments)); } catch (e) {}
    if (savedInstallmentTracks) try { setInstallmentTracks(JSON.parse(savedInstallmentTracks)); } catch (e) {}
    
    if (savedMethods) {
      try { setPaymentMethods(JSON.parse(savedMethods)); } catch (e) {}
    } else {
      setPaymentMethods([
        { id: 1, name: 'Efectivo', type: 'cash', color: 'from-green-400 to-emerald-600' },
        { id: 2, name: 'Tarjeta Débito', type: 'debit', color: 'from-blue-400 to-blue-600' }
      ]);
    }

    if (savedData) {
      try {
        setTransactions(JSON.parse(savedData));
      } catch (e) {
        console.error("Error loading data", e);
      }
    } else {
      setTransactions([
        { id: 1, type: 'ingreso', amount: 500000, description: 'Sueldo', date: new Date().toISOString(), category: 'sueldo', typeClassification: 'mensual', methodId: 1 },
        { id: 2, type: 'gasto', amount: 15000, description: 'Supermercado', date: new Date(Date.now() - 86400000).toISOString(), category: 'comida', typeClassification: 'diario', methodId: 2 },
        { id: 3, type: 'gasto', amount: 80000, description: 'Alquiler', date: new Date(Date.now() - 86400000 * 2).toISOString(), category: 'servicios', typeClassification: 'mensual', methodId: 1 },
      ]);
    }
    setIsLoaded(true);
  }, []);

  useEffect(() => {
    if (isLoaded) {
      localStorage.setItem('finance_data', JSON.stringify(transactions));
      localStorage.setItem('finance_methods', JSON.stringify(paymentMethods));
      localStorage.setItem('finance_settings', JSON.stringify(settings));
      localStorage.setItem('finance_categories', JSON.stringify(categories));
      localStorage.setItem('finance_types', JSON.stringify(typesList));
      localStorage.setItem('finance_commitments', JSON.stringify(commitments));
      localStorage.setItem('finance_installments_track', JSON.stringify(installmentTracks));
    }
  }, [transactions, paymentMethods, settings, categories, typesList, commitments, installmentTracks, isLoaded]);

  const formatAmountInput = (val) => {
    if (!val) return '';
    let clean = val.replace(/[^0-9,]/g, '');
    const parts = clean.split(',');
    if (parts.length > 2) return val;

    let integerPart = parts[0];
    let decimalPart = parts[1] !== undefined ? ',' + parts[1].substring(0, 2) : '';

    if (integerPart) {
      integerPart = parseInt(integerPart, 10).toLocaleString('es-AR');
    }

    return integerPart + decimalPart;
  };

  const parseFormattedAmount = (str) => {
    if (!str) return 0;
    let clean = String(str).replace(/\./g, '').replace(',', '.');
    return parseFloat(clean) || 0;
  };

  const isTransactionInSelectedMonth = (dateString) => {
    const d = new Date(dateString);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${yyyy}-${mm}` === selectedMonth;
  };

  const formatCurrency = (amount) => {
    const numericAmount = parseFloat(amount) || 0;
    const formatted = new Intl.NumberFormat('es-AR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    }).format(numericAmount);

    const symbols = { 'ARS': '$', 'USD': 'US$', 'EUR': '€' };
    return `${symbols[settings.currency] || '$'} ${formatted}`;
  };

  const totals = useMemo(() => {
    return transactions.filter(t => isTransactionInSelectedMonth(t.date)).reduce(
      (acc, curr) => {
        if (curr.type === 'ingreso') {
          acc.income += parseFloat(curr.amount);
          acc.balance += parseFloat(curr.amount);
        } else {
          acc.expense += parseFloat(curr.amount);
          acc.balance -= parseFloat(curr.amount);
          acc.categoryBreakdown[curr.category] = (acc.categoryBreakdown[curr.category] || 0) + parseFloat(curr.amount);
        }
        return acc;
      },
      { balance: 0, income: 0, expense: 0, categoryBreakdown: {} }
    );
  }, [transactions, selectedMonth]);

  const deleteTransaction = (id) => {
    setTransactions(transactions.filter(t => t.id !== id));
  };

  const CardsManager = () => {
    const [isAdding, setIsAdding] = useState(false);
    const [newCardName, setNewCardName] = useState('');
    const [newCardType, setNewCardType] = useState('credit');
    
    const [cardFilterMode, setCardFilterMode] = useState('mes');
    const [cardMonth, setCardMonth] = useState(selectedMonth);
    const [cardDateFrom, setCardDateFrom] = useState(() => {
        const d = new Date();
        d.setDate(1);
        return d.toISOString().split('T')[0];
    });
    const [cardDateTo, setCardDateTo] = useState(() => {
        const d = new Date();
        return d.toISOString().split('T')[0];
    });
    
    const typeColors = {
      credit: 'from-purple-500 to-indigo-600',
      debit: 'from-blue-400 to-blue-600',
      cash: 'from-green-400 to-emerald-600',
      wallet: 'from-sky-400 to-cyan-600'
    };

    const typeLabels = {
      credit: 'Crédito', debit: 'Débito', cash: 'Efectivo', wallet: 'Billetera Virtual'
    };

    const currentMonthExpenses = useMemo(() => {
      const expenses = {};
      transactions.forEach(t => {
        if (t.type === 'gasto' && isTransactionInSelectedMonth(t.date)) {
          expenses[t.methodId] = (expenses[t.methodId] || 0) + parseFloat(t.amount);
        }
      });
      return expenses;
    }, [transactions, selectedMonth]);

    const handleAddCard = (e) => {
      e.preventDefault();
      if(!newCardName) return;
      const newCard = {
        id: Date.now(),
        name: newCardName,
        type: newCardType,
        color: typeColors[newCardType] || 'from-gray-500 to-gray-700'
      };
      setPaymentMethods([...paymentMethods, newCard]);
      setIsAdding(false);
      setNewCardName('');
    };

    const handleDeleteCard = (e, id) => {
      e.stopPropagation();
      setPaymentMethods(paymentMethods.filter(m => m.id !== id));
      if (selectedCardId === id) setSelectedCardId(null);
    };

    if (selectedCardId !== null) {
      const card = paymentMethods.find(m => m.id === selectedCardId);
      
      const cardTransactions = transactions.filter(t => {
          if (t.methodId !== selectedCardId) return false;
          if (cardFilterMode === 'mes') {
              const d = new Date(t.date);
              const yyyy = d.getFullYear();
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              return `${yyyy}-${mm}` === cardMonth;
          } else if (cardFilterMode === 'periodo') {
              const tDate = new Date(t.date).getTime();
              const from = new Date(cardDateFrom + 'T00:00:00').getTime();
              const to = new Date(cardDateTo + 'T23:59:59').getTime();
              return tDate >= from && tDate <= to;
          }
          return true;
      });

      return (
        <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-right-4 duration-300">
          <div className="flex items-center gap-3 mb-4 mt-2">
            <button 
              onClick={() => setSelectedCardId(null)}
              className="bg-gray-100 hover:bg-gray-200 text-gray-800 p-2 rounded-full transition-colors shadow-sm"
            >
              <ArrowLeftIcon />
            </button>
            <div>
              <h1 className="text-xl font-bold text-gray-900">{card ? card.name : 'Detalle de Tarjeta'}</h1>
              <p className="text-xs text-gray-500">
                  {cardFilterMode === 'mes' ? 'Movimientos del mes' : cardFilterMode === 'periodo' ? 'Movimientos por período' : 'Todos los movimientos'}
              </p>
            </div>
          </div>

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4 space-y-3">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtros</p>
            <div className="flex gap-2">
                <select 
                    value={cardFilterMode}
                    onChange={(e) => setCardFilterMode(e.target.value)}
                    className="bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none flex-1"
                >
                    <option value="mes">Mes Específico</option>
                    <option value="periodo">Rango de Fechas</option>
                    <option value="todos">Todo el tiempo</option>
                </select>
                {cardFilterMode === 'mes' && (
                    <input 
                        type="month" 
                        value={cardMonth}
                        onChange={(e) => setCardMonth(e.target.value)}
                        className="bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none flex-1"
                    />
                )}
            </div>
            {cardFilterMode === 'periodo' && (
                <div className="flex gap-2 animate-in fade-in duration-200">
                    <div className="flex-1">
                        <label className="text-[10px] text-gray-500 font-bold block mb-1">Desde</label>
                        <input 
                            type="date" 
                            value={cardDateFrom}
                            onChange={(e) => setCardDateFrom(e.target.value)}
                            className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none"
                        />
                    </div>
                    <div className="flex-1">
                        <label className="text-[10px] text-gray-500 font-bold block mb-1">Hasta</label>
                        <input 
                            type="date" 
                            value={cardDateTo}
                            onChange={(e) => setCardDateTo(e.target.value)}
                            className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-800 outline-none"
                        />
                    </div>
                </div>
            )}
          </div>

          <div className="space-y-3">
            {cardTransactions.length === 0 ? (
              <div className="text-center text-gray-500 mt-6 text-sm bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                No hay movimientos registrados con los filtros seleccionados.
              </div>
            ) : (
              cardTransactions.map(t => {
                const category = categories.find(c => c.id === t.category);
                return (
                  <div key={t.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${t.type === 'ingreso' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                        {t.type === 'ingreso' ? <TrendingUpIcon /> : <TrendingDownIcon />}
                      </div>
                      <div>
                        <p className="font-semibold text-gray-900 text-base">{t.description}</p>
                        <div className="flex items-center gap-2 mt-0.5">
                          <span className="text-xs text-gray-500">
                            {new Date(t.date).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' })}
                          </span>
                          <span className="w-1 h-1 rounded-full bg-gray-300"></span>
                          <span className="text-xs text-gray-500 capitalize">{category ? category.name : t.category}</span>
                        </div>
                      </div>
                    </div>
                    <div className="flex flex-col items-end">
                      <span className={`font-bold ${t.type === 'ingreso' ? 'text-green-600' : 'text-gray-900'}`}>
                        {t.type === 'ingreso' ? '+' : '-'}{formatCurrency(t.amount)}
                      </span>
                      {t.originalCurrency && t.originalCurrency !== settings.currency && (
                        <span className="text-[10px] text-gray-400 font-medium mt-0.5">
                          ({t.originalCurrency} {new Intl.NumberFormat('es-AR').format(t.originalAmount)})
                        </span>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    return (
      <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-bottom-4 duration-300">
        <div className="flex justify-between items-center mb-6 mt-2">
          <h1 className="text-2xl font-bold text-gray-900">Mis Tarjetas</h1>
          <button 
            onClick={() => setIsAdding(!isAdding)}
            className="bg-blue-100 text-blue-600 p-2 rounded-full hover:bg-blue-200 transition-colors shadow-sm"
          >
            <PlusIcon active={false} />
          </button>
        </div>

        {isAdding && (
          <form onSubmit={handleAddCard} className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6 animate-in zoom-in-95 duration-200">
            <h3 className="text-sm font-bold text-gray-800 mb-4">Nueva Tarjeta / Método</h3>
            <input 
              type="text" 
              placeholder="Nombre (ej. Visa Crédito)" 
              value={newCardName}
              onChange={(e) => setNewCardName(e.target.value)}
              className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 mb-3 outline-none focus:border-blue-300 transition-colors"
              required
            />
            <select 
              value={newCardType}
              onChange={(e) => setNewCardType(e.target.value)}
              className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 mb-4 outline-none focus:border-blue-300 appearance-none transition-colors"
            >
              <option value="credit">Tarjeta de Crédito</option>
              <option value="debit">Tarjeta de Débito</option>
              <option value="wallet">Billetera Virtual (Ej. MP)</option>
              <option value="cash">Efectivo</option>
            </select>
            <div className="flex gap-2">
              <button type="button" onClick={() => setIsAdding(false)} className="flex-1 bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-200 transition-colors">Cancelar</button>

  const AddTransaction = () => {
    const [type, setType] = useState('gasto');
    const [amountInput, setAmountInput] = useState('');
    const [description, setDescription] = useState('');
    
    const availableCategories = categories.filter(c => c.type === type);
    const [categoryId, setCategoryId] = useState(availableCategories.length > 0 ? availableCategories[0].id : '');
    const [typeClassification, setTypeClassification] = useState(typesList.length > 0 ? typesList[0].id : 'diario');
    const [methodId, setMethodId] = useState(paymentMethods.length > 0 ? paymentMethods[0].id : '');
    
    const [selectedDateMode, setSelectedDateMode] = useState('hoy');
    const [manualDate, setManualDate] = useState(() => {
      const now = new Date();
      return now.toISOString().split('T')[0];
    });

    const [txCurrency, setTxCurrency] = useState(settings.currency);
    const [exchangeRate, setExchangeRate] = useState('');
    const [isFetchingRate, setIsFetchingRate] = useState(false);

    useEffect(() => {
      if (txCurrency !== settings.currency) {
        setIsFetchingRate(true);
        fetch(`https://open.er-api.com/v6/latest/${txCurrency}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.rates && data.rates[settings.currency]) {
              const rate = data.rates[settings.currency];
              setExchangeRate(rate.toLocaleString('es-AR', { maximumFractionDigits: 4 }));
            }
            setIsFetchingRate(false);
          })
          .catch(() => setIsFetchingRate(false));
      } else {
        setExchangeRate('');
      }
    }, [txCurrency, settings.currency]);

    const handleExchangeRateChange = (e) => {
      let val = e.target.value.replace(/[^0-9,]/g, '');
      const parts = val.split(',');
      if (parts.length > 2) return;
      setExchangeRate(val);
    };

    const getNumericExchangeRate = () => {
      if (!exchangeRate) return 1;
      let clean = exchangeRate.replace(/\./g, '').replace(',', '.');
      return parseFloat(clean) || 1;
    };

    useEffect(() => {
      const avail = categories.filter(c => c.type === type);
      if (avail.length > 0) setCategoryId(avail[0].id);
      else setCategoryId('');
    }, [type, categories]);

    const handleAmountChange = (e) => {
      let val = e.target.value;
      val = val.replace(/[^0-9,]/g, '');
      const parts = val.split(',');
      if (parts.length > 2) return;

      let integerPart = parts[0];
      let decimalPart = parts[1] !== undefined ? ',' + parts[1].substring(0, 2) : '';

      if (integerPart) {
        integerPart = parseInt(integerPart, 10).toLocaleString('es-AR');
      }

      setAmountInput(integerPart + decimalPart);
    };

    const getNumericAmount = () => {
      if (!amountInput) return 0;
      let clean = amountInput.replace(/\./g, '').replace(',', '.');
      return parseFloat(clean) || 0;
    };

    const getDateToSave = () => {
      const now = new Date();
      if (selectedDateMode === 'hoy') {
        return now.toISOString();
      } else if (selectedDateMode === 'ayer') {
        const d = new Date(now.getTime() - 86400000);
        return d.toISOString();
      } else if (selectedDateMode === 'hace2dias') {
        const d = new Date(now.getTime() - 86400000 * 2);
        return d.toISOString();
      } else {
        return new Date(manualDate + 'T00:00:00').toISOString();
      }
    };

    const getDisplayDateInfo = (mode, manualStr) => {
      const now = new Date();
      let d = now;
      if (mode === 'ayer') d = new Date(now.getTime() - 86400000);
      else if (mode === 'hace2dias') d = new Date(now.getTime() - 86400000 * 2);
      else if (mode === 'manual') d = new Date(manualStr + 'T00:00:00');

      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const formattedDate = `${day}/${month}`;

      let label = 'Hoy';
      if (mode === 'ayer') label = 'Ayer';
      else if (mode === 'hace2dias') label = 'Hace 2 días';
      else if (mode === 'manual') label = 'Personalizada';

      return { formattedDate, label };
    };

    const handleSubmit = (e) => {
      e.preventDefault();
      const originalAmount = getNumericAmount();
      if (originalAmount <= 0 || !description || !categoryId) return;

      const rate = txCurrency === settings.currency ? 1 : getNumericExchangeRate();
      const finalAmount = originalAmount * rate;

      const newTransaction = {
        id: Date.now(),
        type,
        amount: finalAmount,
        originalAmount: originalAmount,
        originalCurrency: txCurrency,
        exchangeRate: rate,
        description,
        category: categoryId,
        typeClassification,
        methodId: methodId,
        date: getDateToSave()
      };

      setTransactions([newTransaction, ...transactions]);
      setActiveTab('dashboard');
    };

    return (
      <div className="p-4 pb-24 h-full bg-gray-50 animate-in fade-in slide-in-from-right-4 duration-300">
        <h1 className="text-2xl font-bold text-gray-900 mb-6 mt-2">Nuevo Movimiento</h1>
        
        <form onSubmit={handleSubmit} className="space-y-6">
          <div className="bg-gray-200/60 p-1 rounded-xl flex w-full">
            <button 
              type="button" 
              onClick={() => setType('gasto')}
              className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${type === 'gasto' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}
            >
              Gasto
            </button>
            <button 
              type="button" 
              onClick={() => setType('ingreso')}
              className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${type === 'ingreso' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}
            >
              Ingreso
            </button>
          </div>

          <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center">
            <div className="flex justify-between items-center mb-2">
              <label className="text-sm font-medium text-gray-500">Importe</label>
              <select
                value={txCurrency}
                onChange={(e) => setTxCurrency(e.target.value)}
                className="bg-gray-100 border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 outline-none"
              >
                <option value="ARS">ARS</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
              </select>
            </div>
            <div className="flex items-center justify-center text-4xl font-bold text-gray-900">
              <span className="text-gray-400 mr-1">{txCurrency === 'USD' ? 'U$S' : txCurrency === 'EUR' ? '€' : '$'}</span>
              <input 
                type="text" 
                value={amountInput}
                onChange={handleAmountChange}
                placeholder="0,00"
                className="w-full max-w-[240px] bg-transparent outline-none text-center appearance-none"
                required
                autoFocus
                inputMode="decimal"
              />
            </div>
            {txCurrency !== settings.currency && (
              <div className="mt-4 pt-4 border-t border-gray-100 text-left animate-in fade-in slide-in-from-top-2">
                <label className="block text-xs font-semibold text-gray-500 mb-1">
                  Tipo de cambio ({txCurrency} a {settings.currency}) {isFetchingRate && <span className="text-blue-500 animate-pulse font-normal ml-2">Obteniendo...</span>}
                </label>
                <div className="flex items-center bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                  <span className="text-gray-500 text-sm font-bold mr-2">1 {txCurrency} = </span>
                  <input
                    type="text"
                    value={exchangeRate}
                    onChange={handleExchangeRateChange}
                    placeholder="Ej. 1000,50"
                    className="bg-transparent w-full outline-none text-gray-800 font-semibold text-sm"
                    inputMode="decimal"
                    required
                  />
                  <span className="text-gray-500 text-sm font-bold ml-2">{settings.currency}</span>
                </div>
              </div>
            )}
          </div>

          <div className="space-y-4">
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Descripción</label>
              <input 
                type="text" 
                value={description}
                onChange={(e) => setDescription(e.target.value)}
                placeholder="Ej. Supermercado, Sueldo..."
                className="w-full bg-transparent outline-none text-gray-900 text-lg font-medium"
                required
              />
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Fecha</label>
              <div className="grid grid-cols-4 gap-2 mb-3">
                {['hoy', 'ayer', 'hace2dias', 'manual'].map((mode) => {
                  const info = getDisplayDateInfo(mode, manualDate);
                  const isSelected = selectedDateMode === mode;
                  return (
                    <button
                      key={mode}
                      type="button"
                      onClick={() => setSelectedDateMode(mode)}
                      className={`p-2 rounded-xl text-center border transition-all flex flex-col items-center justify-center ${
                        isSelected ? 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-600'
                      }`}
                    >
                      <span className="text-xs font-bold">{info.formattedDate}</span>
                      <span className="text-[10px] text-gray-500 mt-0.5 truncate w-full">{info.label}</span>
                    </button>
                  );
                })}
              </div>

              {selectedDateMode === 'manual' && (
                <div className="mt-2 animate-in fade-in duration-200">
                  <input 
                    type="date" 
                    value={manualDate}
                    onChange={(e) => setManualDate(e.target.value)}
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none text-gray-900"
                    required
                  />
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Categoría</label>
              <div className="flex flex-wrap gap-2">
                {availableCategories.length === 0 && <span className="text-sm text-gray-400">Ve a Ajustes para crear categorías.</span>}
                {availableCategories.map(cat => (
                  <button
                    key={cat.id}
                    type="button"
                    onClick={() => setCategoryId(cat.id)}
                    className={`py-2 px-3 rounded-xl text-sm font-semibold capitalize transition-all border ${
                      categoryId === cat.id 
                        ? 'bg-blue-50 border-blue-200 text-blue-700' 
                        : 'bg-transparent border-gray-200 text-gray-500'
                    }`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Tipo</label>
              <div className="flex flex-wrap gap-2">
                {typesList.map(tp => (
                  <button
                    key={tp.id}
                    type="button"
                    onClick={() => setTypeClassification(tp.id)}
                    className={`py-2 px-3 rounded-xl text-sm font-semibold capitalize transition-all border ${
                      typeClassification === tp.id 
                        ? 'bg-purple-50 border-purple-200 text-purple-700' 
                        : 'bg-transparent border-gray-200 text-gray-500'
                    }`}
                  >
                    {tp.name}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Medio de Pago / Cobro</label>
              <div className="relative">
                <select 
                  value={methodId}
                  onChange={(e) => setMethodId(Number(e.target.value))}
                  className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 outline-none text-gray-900 font-medium appearance-none focus:border-blue-300 transition-colors"

                </div>

  const HistoryAndHabitual = () => {

    const [editingQuotaId, setEditingQuotaId] = useState(null);
    const [newQuotaName, setNewQuotaName] = useState('');
    const [newQuotaAmount, setNewQuotaAmount] = useState('');
    const [newQuotaCurrent, setNewQuotaCurrent] = useState('1');
    const [newQuotaTotal, setNewQuotaTotal] = useState('12');
    const [newQuotaMethod, setNewQuotaMethod] = useState(paymentMethods[0]?.id || '');
    
    // Cuota start date choice state
    const [quotaDateMode, setQuotaDateMode] = useState('hoy'); // 'hoy', 'manual'
    const [quotaManualDate, setQuotaManualDate] = useState(() => new Date().toISOString().split('T')[0]);

      setNewHabAmount(formatAmountInput(e.target.value));

                          </div>
                          <p className="text-xs text-gray-500 mt-0.5">
                            Valor cuota: <span className="font-bold text-gray-800">{formatCurrency(q.amount)}</span>
                            <span className="text-gray-400"> (Total: {formatCurrency(totalCalculated)})</span>
                          </p>
                          {q.startDate && (
                            <p className="text-[10px] text-gray-400 mt-0.5">
                              📅 Inicio: {new Date(q.startDate).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                            </p>
                          )}
                          {method && (
                            <span className="inline-block text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md font-medium mt-1">
                              💳 {method.name}
                            </span>
                          )}
                        </div>

                        <div className="flex items-center gap-1">
                          {q.current < q.total && (
                            <button 
                              onClick={() => handleIncrementQuota(q.id)}
                              title="Sumar 1 cuota paga"
                              className="bg-purple-50 hover:bg-purple-100 text-purple-700 px-2.5 py-1.5 rounded-xl text-xs font-bold transition-colors shadow-sm"
                            >
                              +1 Cuota
                            </button>
                          )}
                          <button 
                            onClick={() => handleStartEditQuota(q)}
                            title="Modificar"
                            className="text-blue-500 hover:text-blue-700 p-1.5 transition-colors"
                          >
                            <EditIcon />
                          </button>
                          <button 
                            onClick={() => setInstallmentTracks(installmentTracks.filter(item => item.id !== q.id))}
                            title="Eliminar"
                            className="text-gray-400 hover:text-red-500 p-1.5 transition-colors"
                          >
                            <TrashIcon />
                          </button>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-[10px] font-semibold text-gray-500 mb-1">
                          <span>Progreso: {percent}%</span>
                          <span>{q.current === q.total ? '🎉 Finalizado' : `${q.total - q.current} cuotas restantes`}</span>
                        </div>
                        <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                          <div 
                            className={`h-full rounded-full transition-all duration-500 ${q.current === q.total ? 'bg-green-500' : 'bg-purple-600'}`}
                            style={{ width: `${percent}%` }}
                          ></div>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        )}
      </div>
    );
  };

  const SettingsView = () => {
    const [isAddingCategory, setIsAddingCategory] = useState(false);
    const [editingCategoryId, setEditingCategoryId] = useState(null);
    const [editCatName, setEditCatName] = useState('');
    const [editCatType, setEditCatType] = useState('gasto');
    const [editCatBudget, setEditCatBudget] = useState('');

    const [newCatName, setNewCatName] = useState('');
    const [newCatType, setNewCatType] = useState('gasto');
    const [newCatBudget, setNewCatBudget] = useState('');

    const [isAddingType, setIsAddingType] = useState(false);
    const [newTypeName, setNewTypeName] = useState('');

    const handleAddCategory = (e) => {
      e.preventDefault();
      if (!newCatName) return;
      setCategories([...categories, {
        id: `cat_${Date.now()}`,
        name: newCatName,
        type: newCatType,
        budget: parseFloat(newCatBudget) || 0
      }]);
      setNewCatName('');
      setNewCatBudget('');
      setIsAddingCategory(false);
    };

    const handleDeleteCategory = (id) => {
      setCategories(categories.filter(c => c.id !== id));
    };

    const startEditingCategory = (category) => {
      setEditingCategoryId(category.id);
      setEditCatName(category.name);
      setEditCatType(category.type);
      setEditCatBudget(category.budget || '');
    };

    const handleSaveEditCategory = (e, id) => {
      e.preventDefault();
      if (!editCatName) return;
      setCategories(categories.map(c => 
        c.id === id ? { ...c, name: editCatName, type: editCatType, budget: parseFloat(editCatBudget) || 0 } : c
      ));
      setEditingCategoryId(null);
    };

    const moveCategory = (index, direction) => {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= categories.length) return;
      const updated = [...categories];
      const temp = updated[index];
      updated[index] = updated[newIndex];
      updated[newIndex] = temp;
      setCategories(updated);
    };

    const handleAddType = (e) => {
      e.preventDefault();
      if (!newTypeName) return;
      setTypesList([...typesList, {
        id: `type_${Date.now()}`,
        name: newTypeName
      }]);
      setNewTypeName('');
      setIsAddingType(false);
    };

    const handleDeleteType = (id) => {
      setTypesList(typesList.filter(t => t.id !== id));
    };

    return (
      <div className="p-4 pb-24 h-full animate-in fade-in slide-in-from-right-4 duration-300">
        <h1 className="text-2xl font-bold text-gray-900 mb-6 mt-2">Ajustes</h1>

        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
          <h3 className="text-xs font-bold text-blue-600 mb-4 uppercase tracking-wider">General</h3>
          <div className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Filtrar por Mes</label>
              <input 
                type="month" 
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 outline-none text-gray-900 focus:border-blue-300 transition-colors"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Moneda Local (Base)</label>
              <select 
                value={settings.currency}
                onChange={(e) => setSettings({...settings, currency: e.target.value})}
                className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 outline-none text-gray-900 focus:border-blue-300 appearance-none transition-colors"
              >
                <option value="ARS">Pesos Argentinos (ARS)</option>
                <option value="USD">Dólares (USD)</option>
                <option value="EUR">Euros (EUR)</option>
              </select>
            </div>
          </div>
        </div>

        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-xs font-bold text-blue-600 uppercase tracking-wider">Categorías y Presupuestos</h3>
            <button 
              type="button"
              onClick={() => setIsAddingCategory(!isAddingCategory)}
              className={`p-1.5 rounded-full transition-colors shadow-sm ${isAddingCategory ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-blue-100 text-blue-600 hover:bg-blue-200'}`}
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`transform transition-transform ${isAddingCategory ? 'rotate-45' : ''}`}>
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
          
          {isAddingCategory && (
            <form onSubmit={handleAddCategory} className="mb-4 bg-gray-50 p-4 rounded-2xl border border-gray-100 animate-in zoom-in-95 duration-200">
              <p className="text-xs font-semibold text-gray-800 mb-3">Agregar Nueva Categoría</p>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <input type="text" placeholder="Ej. Comida" value={newCatName} onChange={e => setNewCatName(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full outline-none focus:border-blue-300" required />
                <select value={newCatType} onChange={e => setNewCatType(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full bg-white outline-none">
                  <option value="gasto">Gasto</option>
                  <option value="ingreso">Ingreso</option>
                </select>
              </div>
              {newCatType === 'gasto' && (
                <input type="number" placeholder="Límite Mensual (Opcional)" value={newCatBudget} onChange={e => setNewCatBudget(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full mb-3 outline-none" />
              )}
              <div className="flex gap-2">
                <button type="button" onClick={() => setIsAddingCategory(false)} className="flex-1 bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl text-sm">Cancelar</button>
                <button type="submit" className="flex-1 bg-blue-100 text-blue-700 font-semibold py-2.5 rounded-xl text-sm">Crear</button>
              </div>
            </form>
          )}

          <div className="space-y-2">
            {categories.map((c, index) => {
              if (editingCategoryId === c.id) {
                return (
                  <form key={c.id} onSubmit={(e) => handleSaveEditCategory(e, c.id)} className="p-3 bg-blue-50/50 rounded-xl border border-blue-100 mb-2">
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input type="text" value={editCatName} onChange={e => setEditCatName(e.target.value)} className="p-2 rounded-lg text-sm outline-none border border-blue-200" required />
                      <select value={editCatType} onChange={e => setEditCatType(e.target.value)} className="p-2 rounded-lg text-sm bg-white outline-none border border-blue-200">
                        <option value="gasto">Gasto</option>
                        <option value="ingreso">Ingreso</option>
                      </select>
                    </div>
                    {editCatType === 'gasto' && (
                      <input type="number" placeholder="Límite (0 = sin límite)" value={editCatBudget} onChange={e => setEditCatBudget(e.target.value)} className="p-2 rounded-lg text-sm w-full mb-2 outline-none border border-blue-200" />
                    )}
                    <div className="flex gap-2">
                       <button type="button" onClick={() => setEditingCategoryId(null)} className="flex-1 bg-gray-200 text-gray-700 py-1.5 rounded-lg text-xs font-semibold">Cancelar</button>
                       <button type="submit" className="flex-1 bg-blue-500 text-white py-1.5 rounded-lg text-xs font-semibold">Guardar</button>
                    </div>
                  </form>
                );
              }
              return (
                <div key={c.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100 group">
                  <div className="flex items-center gap-2">
                    <div className="flex flex-col gap-0.5">
                      <button type="button" onClick={() => moveCategory(index, -1)} disabled={index === 0} className="text-gray-400 hover:text-gray-700 disabled:opacity-30"><ArrowUpIcon /></button>
                      <button type="button" onClick={() => moveCategory(index, 1)} disabled={index === categories.length - 1} className="text-gray-400 hover:text-gray-700 disabled:opacity-30"><ArrowDownIcon /></button>
                    </div>
                    <div>
                      <p className="text-sm font-semibold text-gray-800">{c.name} <span className="text-[9px] bg-gray-200 px-1.5 py-0.5 rounded text-gray-600 ml-1 uppercase">{c.type}</span></p>
                      {c.type === 'gasto' && c.budget > 0 && <p className="text-xs text-gray-500 mt-0.5">Límite: {formatCurrency(c.budget)}</p>}
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button type="button" onClick={() => startEditingCategory(c)} className="text-blue-400 p-2 hover:bg-blue-50 rounded-lg"><EditIcon /></button>
                    <button type="button" onClick={() => handleDeleteCategory(c.id)} className="text-red-400 p-2 hover:bg-red-50 rounded-lg"><TrashIcon /></button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-xs font-bold text-blue-600 uppercase tracking-wider">Tipos de Movimientos</h3>
            <button 
              type="button"
              onClick={() => setIsAddingType(!isAddingType)}
              className={`p-1.5 rounded-full transition-colors shadow-sm ${isAddingType ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`transform transition-transform ${isAddingType ? 'rotate-45' : ''}`}>
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>

          {isAddingType && (
            <form onSubmit={handleAddType} className="mb-4 bg-gray-50 p-4 rounded-2xl border border-gray-100 animate-in zoom-in-95 duration-200">
              <p className="text-xs font-semibold text-gray-800 mb-3">Nuevo Tipo (ej. Cuotas)</p>
              <input type="text" placeholder="Nombre del tipo" value={newTypeName} onChange={e => setNewTypeName(e.target.value)} className="p-2.5 rounded-xl border border-gray-200 text-sm w-full mb-3 outline-none" required />
              <div className="flex gap-2">
                <button type="button" onClick={() => setIsAddingType(false)} className="flex-1 bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl text-sm">Cancelar</button>
                <button type="submit" className="flex-1 bg-purple-100 text-purple-700 font-semibold py-2.5 rounded-xl text-sm">Crear</button>
              </div>
            </form>
          )}

          <div className="space-y-2">
            {typesList.map(t => (
              <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                <p className="text-sm font-semibold text-gray-800 capitalize">{t.name}</p>
                <button onClick={() => handleDeleteType(t.id)} className="text-red-400 p-2 hover:bg-red-50 rounded-lg"><TrashIcon /></button>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  if (!isLoaded) return null;

  return (
    <div className="bg-gray-200 min-h-screen flex justify-center font-sans">
      <div className="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col">
        <div className="w-full h-safe-top pt-8 bg-gray-50"></div>

        <div className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar">
          {activeTab === 'dashboard' && <Dashboard />}
          {activeTab === 'cards' && <CardsManager />}
          {activeTab === 'add' && <AddTransaction />}
          {activeTab === 'history' && <HistoryAndHabitual />}
          {activeTab === 'settings' && <SettingsView />}
        </div>

        <div className="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-50">
          <div className="flex justify-between items-center h-20 px-4 pb-4 pt-2">
            <button onClick={() => { setActiveTab('dashboard'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <HomeIcon active={activeTab === 'dashboard' && selectedCardId === null} />
              <span className={`text-[10px] font-medium ${activeTab === 'dashboard' && selectedCardId === null ? 'text-blue-600' : 'text-gray-500'}`}>Inicio</span>
            </button>

            <button onClick={() => { setActiveTab('cards'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <CreditCardIcon active={activeTab === 'cards'} />
              <span className={`text-[10px] font-medium ${activeTab === 'cards' ? 'text-blue-600' : 'text-gray-500'}`}>Tarjetas</span>
            </button>

            <button onClick={() => { setActiveTab('add'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center -mt-8 relative w-16">
              <div className="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 text-white transform transition-transform active:scale-95 border-4 border-gray-50 absolute">
                <PlusIcon active={true} />
              </div>
            </button>

            <button onClick={() => { setActiveTab('history'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <ListIcon active={activeTab === 'history'} />
              <span className={`text-[10px] font-medium ${activeTab === 'history' ? 'text-blue-600' : 'text-gray-500'}`}>Historial</span>
            </button>

            <button onClick={() => { setActiveTab('settings'); setSelectedCardId(null); }} className="flex flex-col items-center justify-center w-12 gap-1">
              <SettingsIcon active={activeTab === 'settings'} />
              <span className={`text-[10px] font-medium ${activeTab === 'settings' ? 'text-blue-600' : 'text-gray-500'}`}>Ajustes</span>
            </button>
          </div>
        </div>
        
        <style dangerouslySetInnerHTML={{__html: `
          .no-scrollbar::-webkit-scrollbar { display: none; }
          .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        `}} />
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ExpenseTrackerApp />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
